<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>KGFIPL Portal</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f6fa;--c:#fff;--tx:#14202e;--m:#5d6b7c;--p:#0d5c9e;--b:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0e141b;--c:#18212b;--tx:#e8edf3;--m:#93a1b1;--p:#4aa3e8;--b:#2a3644}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit}.btn{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.btn.alt{background:none;color:var(--p);border:1px solid var(--p)}.btn:disabled{opacity:.5}
input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--tx);margin:4px 0 10px}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(rgba(6,18,36,.30),rgba(6,18,36,.50)),url(/static/img/office-lobby.jpg) center/cover}
@media(min-width:900px){#lg{justify-content:flex-end;padding-right:8vw}}
.shell{min-height:100vh;position:relative}.shell::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,20,36,.50),rgba(8,20,36,.78)),var(--shell) center/cover no-repeat}
.shell.lobby{--shell:url(/static/img/office-lobby.jpg)}.shell.exec{--shell:url(/static/img/office-exec.jpg)}
.shell main>h2,.shell .lede{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}.lede{margin:-6px 0 16px}
.lb{width:100%;max-width:380px;background:rgba(255,255,255,.95);color:#14202e;border-radius:16px;padding:26px}.lb input{background:#fff;color:#14202e;border-color:#cfd7e0}.lb h1{margin:0 0 4px;font-size:23px}.lb .sub{margin:0 0 16px;color:#5d6b7c;font-size:14px}.lb .brand{font-size:13px;font-weight:600;letter-spacing:.05em;color:#5d6b7c;margin-bottom:4px}
.lb h1.elogin{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;font-size:34px;font-weight:800;font-style:italic;letter-spacing:-.5px;line-height:1.1;margin:0 0 14px;padding-bottom:12px;position:relative;background:linear-gradient(90deg,#0a3d6e,#1ba3e0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lb h1.elogin::after{content:'';position:absolute;left:0;bottom:0;width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,#0a3d6e,#1ba3e0)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border:1px solid #cfd7e0;background:#fff;color:#14202e;border-radius:8px;cursor:pointer;font-weight:600}.tabs .on{background:#0d5c9e;color:#fff}
.er{color:#c0392b;font-size:14px;min-height:18px;margin:6px 0}.ok{color:#1e8e4e}.bad{color:#c0392b}
header{background:var(--p);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}header .btn{background:rgba(255,255,255,.2)}
main{max-width:1150px;margin:auto;padding:18px 14px 50px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.sg{background:var(--c);border:1px solid var(--b);border-radius:14px;overflow:hidden;cursor:pointer}.sg.off{opacity:.4;cursor:not-allowed}
.sg .im{height:125px;background-size:cover;background-position:center}.sg .t{padding:10px 12px;font-weight:600}.sg small{display:block;color:var(--m);font-weight:400}
.pn{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--b);white-space:nowrap}td img{width:36px;height:36px;border-radius:6px;object-fit:cover;vertical-align:middle}
video{width:100%;max-width:300px;border-radius:12px;background:#000}.hero{height:150px;border-radius:14px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px;color:#fff;font-size:21px;font-weight:700;text-shadow:0 2px 6px #000}a{color:var(--p)}
.sg .d{display:block;color:var(--m);font-weight:400;font-size:13px;margin-top:3px;line-height:1.35}
.pbtn{flex:1;min-width:120px;padding:18px 10px;font-size:19px;font-weight:700;color:#fff;border:0;border-radius:12px;cursor:pointer}.pbtn:disabled{opacity:.5}.pres{background:#1e9e4e}.abs{background:#d03a2c}
.lb .go{margin:0}
</style></head><body><div id="app"></div><script>
let SG=[],stream=null;
const $=i=>document.getElementById(i),A=$('app'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toLocaleDateString('en-CA');
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error '+r.status);return j}
const img=s=>`url(/static/img/${s[2]}.jpg)`;
async function segs(){if(!SG.length)SG=await api('/api/segments');return SG}

// ================= EMPLOYEE SIDE (no login) =================
// 1) plain Employee Login page
function startPage(){stopCam();A.innerHTML=`<div id="lg"><div class="lb"><button class="btn go" style="width:100%;font-size:20px;padding:16px" onclick="segmentsPage()">Employee Login</button></div></div>`}
// 2) the 12 segments, each with a one-line description
async function segmentsPage(){stopCam();try{await segs()}catch(e){return alert(e.message)}
 A.innerHTML=`<div class="shell lobby"><header><div><b>KGFIPL</b> &nbsp;Employee attendance</div><div><button class="btn" onclick="startPage()">Home</button></div></header><main><h2>Business segments</h2><p class="lede">Open your segment to mark attendance with photo and location.</p><div class="grid">${SG.map(s=>`<div class="sg" onclick="segPage(${s[0]})"><div class="im" style="background-image:${img(s)}"></div><div class="t">${s[0]}. ${esc(s[1])}<span class="d">${esc(s[4])}</span></div></div>`).join('')}</div></main></div>`}
// 3) inside one segment: login first, then Present / Leave
let ME=null;
async function segPage(n){stopCam();ME=null;await segs();const s=SG.find(x=>x[0]==n);
 A.innerHTML=`<div class="shell exec"><header><div><b>KGFIPL</b> &nbsp;Employee attendance</div><div><button class="btn" onclick="segmentsPage()">Segments</button> <button class="btn" onclick="startPage()">Home</button></div></header><main>
 <div class="hero" style="background-image:linear-gradient(transparent 30%,rgba(0,0,0,.7)),${img(s)}">${s[0]}. ${esc(s[1])}</div>
 <div class="pn" id="box"><h3 style="margin-top:0">Login – ${esc(s[1])}</h3><div style="max-width:420px">
  <label>Employee ID</label><input id="ac" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. KGF001">
  <label>Name</label><input id="an" autocomplete="off" placeholder="Your full name">
  <label>Password</label><input id="ap" type="password" autocomplete="off">
  <button class="btn" id="bl" style="width:100%" onclick="segLogin(${n})">Login</button><div class="er" id="ms"></div></div></div></main></div>`;
 $('ac').onkeydown=$('an').onkeydown=$('ap').onkeydown=e=>{if(e.key==='Enter')segLogin(n)}}
async function segLogin(n){const ec=$('ac').value.trim(),nm=$('an').value.trim(),pw=$('ap').value;
 if(!ec||!nm||!pw)return msg('Enter your Employee ID, Name and Password.','bad');
 $('bl').disabled=true;
 try{const r=await api('/api/check',{seg:n,ecode:ec,name:nm,password:pw});ME={seg:n,ecode:ec,name:nm,password:pw};attPage(r)}
 catch(e){msg(esc(e.message),'bad');$('bl').disabled=false}}
function attPage(r){const done=r.marked;
 $('box').innerHTML=`<h3 style="margin-top:0">Welcome, ${esc(r.name)} <small style="color:var(--m);font-weight:400">(${esc(r.ecode)})</small></h3><div class="row" style="align-items:start"><div>
  <p style="margin-top:0;color:var(--m)">Attendance for <b>${today()}</b></p>
  ${done?`<div class="${done.status=='present'?'ok':'bad'}" style="font-size:17px;font-weight:600">Already marked ${done.status.toUpperCase()} today at ${done.time}</div>`
  :`<div class="row"><button class="pbtn pres" id="bp" onclick="mark('present')">Present</button><button class="pbtn abs" id="ba" onclick="mark('leave')">Leave</button></div><p style="color:var(--m);font-size:13px">Press a button, tap <b>Allow</b> for location and camera, and your photo is taken automatically.</p>`}
  <div class="er" id="ms"></div></div>
  <div style="flex:0 0 auto"><video id="v" autoplay playsinline muted style="display:none"></video></div></div>`}
const msg=(h,c)=>{const m=$('ms');if(m)m.innerHTML=c?`<span class="${c}">${h}</span>`:h};
function stopCam(){stream?.getTracks().forEach(t=>t.stop());stream=null}
const getPos=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Location is not supported on this device'));navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>no(new Error('Location blocked – please allow location to mark attendance')),{enableHighAccuracy:true,timeout:20000,maximumAge:0})});
const getCam=()=>{if(!navigator.mediaDevices?.getUserMedia)return Promise.reject(new Error('Camera is not available (open the portal over https)'));return navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}).catch(()=>{throw new Error('Camera blocked – please allow camera access to mark attendance')})};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function mark(st){
 if(!ME)return;const bs=[$('bp'),$('ba')];bs.forEach(b=>b.disabled=true);
 try{
  msg('Please tap <b>Allow</b> to share your location…');
  const pos=await getPos();
  msg('Location OK. Please tap <b>Allow</b> for the camera…');
  stream=await getCam();
  const v=$('v');v.style.display='block';v.srcObject=stream;await v.play().catch(()=>{});
  msg('Taking your photo…');
  for(let i=0;i<30&&!v.videoWidth;i++)await wait(100);await wait(1200);
  const w=320,h=Math.round(w*(v.videoHeight||240)/(v.videoWidth||320)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);
  x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-18,w,18);x.fillStyle='#fff';x.font='10px sans-serif';x.fillText(ME.ecode.toUpperCase()+' '+st.toUpperCase()+' '+new Date().toLocaleString()+' '+pos.lat.toFixed(4)+','+pos.lng.toFixed(4),4,h-5);
  const photo=c.toDataURL('image/jpeg',.6);stopCam();v.srcObject=null;v.style.display='none';
  msg('Saving…');
  const r=await api('/api/attendance',{seg:ME.seg,ecode:ME.ecode,name:ME.name,password:ME.password,status:st,lat:pos.lat,lng:pos.lng,acc:pos.acc,photo});
  bs.forEach(b=>b.remove());
  msg(`✔ <b>${esc(r.name)}</b> marked <b>${r.status.toUpperCase()}</b> at ${r.time}. Photo and location saved.<br><img src="${photo}" style="width:120px;border-radius:8px;margin-top:8px">`,r.status=='present'?'ok':'bad');
 }catch(e){stopCam();const v=$('v');if(v){v.srcObject=null;v.style.display='none'}msg(esc(e.message),'bad');bs.forEach(b=>{if(b)b.disabled=false})}}

startPage();
</script></body></html>
